
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Strike</title>
<!-- Neon/Cyberpunk font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060014;
  --panel: rgba(20,8,40,0.6);
  --accent: #00fff6;
  --accent-2: #ff2dd4;
  --muted: #8aa0d9;
  --good: #7effa1;
  --bad: #ff6b9a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: radial-gradient(ellipse at center, rgba(5,2,20,1) 0%, rgba(3,0,12,1) 60%), linear-gradient(180deg, rgba(8,0,30,0.6), rgba(0,0,0,1));
  color: #e6f7ff;
  min-height: 100vh;
  padding: 26px;
  background-image: repeating-linear-gradient(0deg, rgba(0,255,246,0.02) 0px, rgba(0,255,246,0.02) 1px, transparent 1px, transparent 40px), radial-gradient(circle at 10% 10%, rgba(255,45,212,0.03), transparent 15%);
}

#app {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
}

.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25));
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 24px rgba(0,255,246,0.04) inset;
  border: 1px solid rgba(0,255,246,0.08);
  backdrop-filter: blur(6px);
}

#canvasWrapper {
  position: relative;
  aspect-ratio: 16/9;
  background: linear-gradient(180deg, #03061a, #060014);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  border: 2px solid rgba(0,255,246,0.06);
}

#canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--accent);
  letter-spacing: 0.6px;
  text-shadow: 0 0 8px rgba(0,255,246,0.12);
}

.subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
  font-family: 'Share Tech Mono', monospace;
}

.button-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 16px;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25));
  border: 1px solid rgba(0,255,246,0.08);
  color: #dffcff;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s ease-in-out;
  user-select: none;
  box-shadow: 0 6px 18px rgba(0,0,0,0.6);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 18px rgba(0,255,246,0.06);
  border-color: rgba(0,255,246,0.18);
}

.btn.active {
  background: linear-gradient(90deg, rgba(0,255,246,0.06), rgba(255,45,212,0.04));
  border-color: var(--accent);
  box-shadow: 0 6px 28px rgba(0,255,246,0.08), 0 0 24px rgba(255,45,212,0.04);
  color: var(--accent-2);
}

.btn.shoot {
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  color: #041018;
  font-weight: 700;
  flex: 1;
  border-color: rgba(0,255,246,0.2);
  box-shadow: 0 8px 30px rgba(255,45,212,0.08), 0 0 28px rgba(0,255,246,0.06);
}

.btn.shoot:hover {
  background: linear-gradient(180deg, #ffd633, #ffcc00);
}

.btn.shoot:active {
  transform: scale(0.98);
}

.zone-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.zone {
  padding: 14px;
  border-radius: 8px;
  background: rgba(255,255,255,0.02);
  border: 1px dashed rgba(255,255,255,0.08);
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}

.zone:hover {
  background: rgba(255,255,255,0.04);
}

.zone.selected {
  background: linear-gradient(180deg, rgba(255,204,0,0.08), rgba(255,204,0,0.02));
  border-color: var(--accent);
  color: var(--accent);
  border-style: solid;
}

.power-bar {
  height: 14px;
  background: linear-gradient(90deg, rgba(255,45,212,0.12), rgba(0,255,246,0.12));
  border-radius: 10px;
  overflow: visible;
  margin-top: 8px;
  position: relative;
  border: 1px solid rgba(0,255,246,0.12);
}

.power-fill {
  position: absolute;
  left: 0;
  top: -6px;
  height: calc(100% + 12px);
  width: 3%;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  border-radius: 6px;
  box-shadow: 0 0 18px rgba(255,45,212,0.12), 0 0 14px rgba(0,255,246,0.08);
  transition: width 0.06s linear;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  text-shadow: 0 0 8px rgba(0,255,246,0.08);
}

.slider-group {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 8px;
}

input[type="range"] {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  outline: none;
  -webkit-appearance: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
}

.button-row {
  display: flex;
  gap: 8px;
}

@media (max-width: 1024px) {
  #app {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div id="app">
  <div class="card">
    <div id="canvasWrapper">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div class="card controls">
    <div>
      <div class="section-title">Neon Strike</div>
      <div class="subtitle">Click inside the goal to aim and instantly shoot.</div>
    </div>

    <div>
      <div class="stat-row">
        <div>
          <div class="stat-label">Goals</div>
          <div class="stat-value" id="goals">0 / 0</div>
        </div>
        <div>
          <div class="stat-label">Streak</div>
          <div class="stat-value" id="streak">0</div>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="modeBtn">Mode: Shooter</button>
      <button class="btn" id="soundBtn">Sound: ON</button>
    </div>

    <div>
      <div class="stat-label">Difficulty</div>
      <div class="slider-group">
        <span style="color: var(--muted); font-size: 13px;">Easy</span>
        <input type="range" id="difficulty" min="1" max="5" value="3">
        <span style="color: var(--muted); font-size: 13px;">Hard</span>
      </div>
    </div>
  </div>
</div>

<script>
// Configuration
const CONFIG = {
  width: 1200,
  height: 675,
  gravity: 1400,
  ballRadius: 16,
  goalX: 250,
  goalY: 80,
  goalWidth: 700,
  goalHeight: 320,
  penaltyDistance: 500 // realistic penalty distance
};

// Canvas setup
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.width;
canvas.height = CONFIG.height;

// Game state
let shotType = 'power';
let selectedZone = 'mm';
let power = 0;
let isCharging = false;
let chargeStartTime = 0;
let soundEnabled = true;

let goals = 0;
let attempts = 0;
let streak = 0;

let ball = {
  x: CONFIG.width / 2,
  y: CONFIG.height - 100,
  z: 0,
  vx: 0,
  vy: 0,
  vz: 0,
  spin: 0,
  active: false,
  missedGoal: false,
  inGoal: false,
  scored: false,
  trail: []
};

let keeper = {
  x: CONFIG.goalX + CONFIG.goalWidth / 2,
  // place keeper close to net floor (slightly above ground)
  y: CONFIG.goalY + CONFIG.goalHeight - 30,
  targetX: CONFIG.goalX + CONFIG.goalWidth / 2,
  targetY: CONFIG.goalY + CONFIG.goalHeight - 30,
  diving: false,
  diveTime: 0,
  deflecting: false,
  deflectTime: 0,
  rotation: 0
};

let targetPoint = { x: CONFIG.width / 2, y: CONFIG.goalY + CONFIG.goalHeight / 2 };

// Audio context
let audioContext;
function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(freq, duration, type = 'sine') {
  if (!soundEnabled) return;
  initAudio();
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.frequency.value = freq;
  osc.type = type;
  gain.gain.setValueAtTime(0.3, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();
  osc.stop(audioContext.currentTime + duration);
}

// UI Elements
const shotButtons = document.querySelectorAll('#shotTypes .btn');
shotButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    shotButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    shotType = btn.dataset.type;
  });
});

const zoneButtons = document.querySelectorAll('#zones .zone');
zoneButtons.forEach(zone => {
  zone.addEventListener('click', () => {
    zoneButtons.forEach(z => z.classList.remove('selected'));
    zone.classList.add('selected');
    selectedZone = zone.dataset.zone;
    updateTargetPoint();
  });
});

const shootBtn = document.getElementById('shootBtn');
const resetBtn = document.getElementById('resetBtn');
const soundBtn = document.getElementById('soundBtn');
const modeBtn = document.getElementById('modeBtn');
const powerFill = document.getElementById('powerFill');
const difficultySlider = document.getElementById('difficulty');

// Mode: 'shooter' (player shoots) or 'keeper' (player is keeper, AI shoots)
let gameMode = 'shooter';
let aiPending = false;
let aiScheduled = false;
let aiCountdownEnd = 0; // timestamp when AI will fire (ms)

// Update target point based on zone
function updateTargetPoint() {
  const zones = {
    tl: { x: 0.2, y: 0.25 },
    tm: { x: 0.5, y: 0.25 },
    tr: { x: 0.8, y: 0.25 },
    ml: { x: 0.2, y: 0.5 },
    mm: { x: 0.5, y: 0.5 },
    mr: { x: 0.8, y: 0.5 },
    bl: { x: 0.2, y: 0.75 },
    bm: { x: 0.5, y: 0.75 },
    br: { x: 0.8, y: 0.75 }
  };
  
  const zone = zones[selectedZone] || zones.mm;
  targetPoint.x = CONFIG.goalX + CONFIG.goalWidth * zone.x;
  targetPoint.y = CONFIG.goalY + CONFIG.goalHeight * zone.y;
}

updateTargetPoint();

// Canvas click to set target
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CONFIG.width / rect.width;
  const scaleY = CONFIG.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  if (gameMode === 'shooter') {
    // If click is inside goal -> aim there and immediately shoot.
    if (x >= CONFIG.goalX && x <= CONFIG.goalX + CONFIG.goalWidth &&
        y >= CONFIG.goalY && y <= CONFIG.goalY + CONFIG.goalHeight) {
      targetPoint.x = x;
      targetPoint.y = y;
      zoneButtons.forEach(z => z.classList.remove('selected'));
      selectedZone = null;

      // Power determined by vertical click position inside goal (higher -> stronger)
      const relY = (CONFIG.goalY + CONFIG.goalHeight - y) / CONFIG.goalHeight;
      const powerLevel = Math.min(1, Math.max(0.15, relY));
      shoot(powerLevel);
    } else {
      // Click outside goal just moves target crosshair
      targetPoint.x = x;
      targetPoint.y = y;
    }
  } else {
    // Keeper mode: clicking inside goal repositions keeper horizontally (no auto-dive)
    if (x >= CONFIG.goalX && x <= CONFIG.goalX + CONFIG.goalWidth &&
        y >= CONFIG.goalY && y <= CONFIG.goalY + CONFIG.goalHeight) {
      keeper.x = Math.max(CONFIG.goalX + 40, Math.min(CONFIG.goalX + CONFIG.goalWidth - 40, x));
    } else {
      // clicking outside recenters keeper horizontally
      keeper.x = Math.max(CONFIG.goalX + 40, Math.min(CONFIG.goalX + CONFIG.goalWidth - 40, x));
    }
  }
});

// Keyboard controls for keeper mode: ArrowLeft/ArrowRight to move, Space to dive
const keys = { left: false, right: false };

// helper to trigger a player dive
function triggerPlayerDive() {
  if (keeper.diving) return;
  // determine a sensible targetX: prefer ball position if active
  const baseY = CONFIG.goalY + CONFIG.goalHeight - 30;
  let targetX = keeper.x;
  if (ball && ball.active) {
    // aim toward the ball but add lateral bias so the dive looks diagonal
    const lateralBias = (ball.x - keeper.x) * 0.5 + (ball.x < keeper.x ? -40 : 40);
    targetX = keeper.x + lateralBias;
  } else if (keys.left) targetX = keeper.x - 140;
  else if (keys.right) targetX = keeper.x + 140;
  targetX = Math.max(CONFIG.goalX + 30, Math.min(CONFIG.goalX + CONFIG.goalWidth - 30, targetX));

  // targetY: dive toward a point above the ground to create a pronounced diagonal
  let targetY = baseY - 110;
  if (ball && ball.active) targetY = Math.max(CONFIG.goalY + 30, Math.min(CONFIG.goalY + CONFIG.goalHeight - 20, ball.y - 20));

  keeper.playerDive = true;
  keeper.diving = true;
  keeper.diveTime = Date.now();
  keeper.startX = keeper.x;
  keeper.startY = keeper.y;
  keeper.targetX = targetX;
  keeper.targetY = targetY;
  keeper.diveDuration = 0.22;
  // set rotation to 45deg toward the dive direction for a pronounced diagonal pose
  const sign = Math.sign(keeper.targetX - keeper.startX) || 1;
  keeper.rotation = sign * (Math.PI / 4);
}

// Long dive (Space), Low dive (ArrowDown), Jump (ArrowUp) + optional diagonal with left/right
function triggerLongDive() {
  if (keeper.diving) return;
  const baseY = CONFIG.goalY + CONFIG.goalHeight - 30;
  let targetX = keeper.x;
  if (ball && ball.active) targetX = keeper.x + (ball.x - keeper.x) * 0.6 + (ball.x < keeper.x ? -80 : 80);
  else if (keys.left) targetX = keeper.x - 220;
  else if (keys.right) targetX = keeper.x + 220;
  targetX = Math.max(CONFIG.goalX + 30, Math.min(CONFIG.goalX + CONFIG.goalWidth - 30, targetX));
  const targetY = baseY - 140;

  keeper.playerDive = true;
  keeper.diving = true;
  keeper.diveTime = Date.now();
  keeper.startX = keeper.x;
  keeper.startY = keeper.y;
  keeper.targetX = targetX;
  keeper.targetY = targetY;
  keeper.diveDuration = 0.32; // longer, more committed dive
  const sign = Math.sign(keeper.targetX - keeper.startX) || 1;
  keeper.rotation = sign * (Math.PI / 4);
}

function triggerLowDive() {
  if (keeper.diving) return;
  const baseY = CONFIG.goalY + CONFIG.goalHeight - 30;
  let targetX = keeper.x;
  if (ball && ball.active) targetX = ball.x;
  else if (keys.left) targetX = keeper.x - 90;
  else if (keys.right) targetX = keeper.x + 90;
  targetX = Math.max(CONFIG.goalX + 30, Math.min(CONFIG.goalX + CONFIG.goalWidth - 30, targetX));
  const targetY = baseY - 40; // low reach toward post

  keeper.playerDive = true;
  keeper.diving = true;
  keeper.diveTime = Date.now();
  keeper.startX = keeper.x;
  keeper.startY = keeper.y;
  keeper.targetX = targetX;
  keeper.targetY = targetY;
  keeper.diveDuration = 0.18;
  const sign = Math.sign(keeper.targetX - keeper.startX) || 1;
  keeper.rotation = sign * (Math.PI / 4);
}

function triggerJump() {
  if (keeper.diving) return;
  const baseY = CONFIG.goalY + CONFIG.goalHeight - 30;
  let targetX = keeper.x;
  if (keys.left) targetX = keeper.x - 100;
  else if (keys.right) targetX = keeper.x + 100;
  targetX = Math.max(CONFIG.goalX + 30, Math.min(CONFIG.goalX + CONFIG.goalWidth - 30, targetX));
  const targetY = baseY - 160; // higher but shorter duration

  keeper.playerDive = true;
  keeper.diving = true;
  keeper.diveTime = Date.now();
  keeper.startX = keeper.x;
  keeper.startY = keeper.y;
  keeper.targetX = targetX;
  keeper.targetY = targetY;
  keeper.diveDuration = 0.20;
  const sign = Math.sign(keeper.targetX - keeper.startX) || 1;
  keeper.rotation = sign * (Math.PI / 4);
}

document.addEventListener('keydown', (e) => {
  if (gameMode !== 'keeper') return;
  // Arrow keys for horizontal movement (flags only)
  if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }

  if (e.key === 'ArrowUp') { triggerJump(); e.preventDefault(); }
  if (e.code === 'Space') { triggerLongDive(); e.preventDefault(); }
  if (e.key === 'ArrowDown') { triggerLowDive(); e.preventDefault(); }
});

document.addEventListener('keyup', (e) => {
  if (gameMode !== 'keeper') return;
  if (e.key === 'ArrowLeft') { keys.left = false; }
  if (e.key === 'ArrowRight') { keys.right = false; }
});

// Shoot button - hold to charge (only if element exists)
if (shootBtn) {
  shootBtn.addEventListener('mousedown', () => {
    if (ball.active) return;
    isCharging = true;
    chargeStartTime = Date.now();
    initAudio();
  });

  shootBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (ball.active) return;
    isCharging = true;
    chargeStartTime = Date.now();
    initAudio();
  });
}

function releaseShot() {
  if (!isCharging) return;
  isCharging = false;
  shoot(power);
  power = 0;
  if (powerFill) powerFill.style.width = '0%';
}

document.addEventListener('mouseup', releaseShot);
document.addEventListener('touchend', releaseShot);

resetBtn.addEventListener('click', resetGame);

modeBtn.addEventListener('click', () => {
  // toggle modes
  gameMode = gameMode === 'shooter' ? 'keeper' : 'shooter';
  modeBtn.textContent = gameMode === 'shooter' ? 'Mode: Shooter' : 'Mode: Keeper';
  // reset some state
  aiPending = false;
});

soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? 'Sound: ON' : 'Sound: OFF';
});

// Shoot function with 3D physics
function shoot(powerLevel) {
  if (ball.active) return;
  ball.active = true;
  ball.missedGoal = false;
  ball.trail = [];
  
  const dx = targetPoint.x - ball.x;
  const dy = targetPoint.y - ball.y;
  
  let speed = 600 + powerLevel * 700;
  
  // Shot type modifiers
  if (shotType === 'power') {
    speed *= 1.25;
    ball.spin = (Math.random() - 0.5) * 200;
  } else if (shotType === 'curve') {
    speed *= 1.0;
    ball.spin = (Math.random() > 0.5 ? 1 : -1) * 450;
  } else if (shotType === 'knuckle') {
    speed *= 1.1;
    ball.spin = 0;
  } else if (shotType === 'finesse') {
    speed *= 0.9;
    ball.spin = (Math.random() - 0.5) * 180;
  }
  
  // Calculate velocities - shoot upward toward goal
  const distance = Math.sqrt(dx * dx + dy * dy);
  const timeToGoal = distance / speed;
  
  ball.vx = dx / timeToGoal;
  ball.vy = (dy / timeToGoal) - (0.5 * CONFIG.gravity * timeToGoal); // arc upward
  ball.vz = 0; // will be set when entering goal
  
  playSound(150, 0.2, 'sawtooth');
  
  // Only increment attempts after shot is taken
  attempts++;
  updateStats();
  
  // Keeper AI
  const difficulty = parseInt(difficultySlider.value);
  const reactionTime = 0.35 - difficulty * 0.04;
  
  setTimeout(() => {
    keeper.diving = true;
    keeper.diveTime = Date.now();
    keeper.startX = keeper.x;
    keeper.startY = keeper.y;
    // Dive duration scales with difficulty (higher difficulty -> faster dive)
    keeper.diveDuration = Math.max(0.25, 0.7 - difficulty * 0.08);
    
    // Predict where ball will be
    const errorMargin = 80 * (6 - difficulty);
    keeper.targetX = targetPoint.x + (Math.random() - 0.5) * errorMargin;
    keeper.targetY = targetPoint.y + (Math.random() - 0.5) * errorMargin * 0.6;
    
    keeper.targetX = Math.max(CONFIG.goalX + 40, Math.min(CONFIG.goalX + CONFIG.goalWidth - 40, keeper.targetX));
    keeper.targetY = Math.max(CONFIG.goalY + 40, Math.min(CONFIG.goalY + CONFIG.goalHeight - 40, keeper.targetY));
    
    // Calculate dive rotation
    keeper.rotation = Math.atan2(keeper.targetY - keeper.y, keeper.targetX - keeper.x);
  }, reactionTime * 1000);
}

// AI shoot function (used when player is keeper)
function aiShoot() {
  if (ball.active || gameMode !== 'keeper') return;

  const difficulty = parseInt(difficultySlider.value);
  // AI decides power: easier -> lower power with variance; harder -> stronger
  const base = 0.45 + (difficulty - 1) * 0.14; // maps 1..5 -> ~0.45..1.01
  const powerLevel = Math.min(1, Math.max(0.15, base + (Math.random() - 0.5) * 0.18));

  // AI chooses target inside goal; harder difficulty -> smaller error
  const err = 120 - difficulty * 18; // difficulty high -> err small
  const tx = CONFIG.goalX + 40 + Math.random() * (CONFIG.goalWidth - 80) + (Math.random() - 0.5) * err;
  const ty = CONFIG.goalY + 20 + Math.random() * (CONFIG.goalHeight - 40) + (Math.random() - 0.5) * err * 0.4;

  // Visual: charge indicator for AI (animate powerFill if present)
  if (powerFill) {
    let start = Date.now();
    const chargeDur = 700 + (1 - powerLevel) * 600;
    const aiChargeInterval = setInterval(() => {
      const t = Math.min(1, (Date.now() - start) / chargeDur);
      powerFill.style.width = (t * powerLevel * 100) + '%';
      if (t >= 1) {
        clearInterval(aiChargeInterval);
      }
    }, 30);
  }

  // Slight delay before shooting to simulate AI reaction
  setTimeout(() => {
    // place ball at penalty spot
    ball.x = CONFIG.width / 2;
    ball.y = CONFIG.height - 100;
    ball.z = 0;
    ball.trail = [];
    ball.missedGoal = false;
    ball.inGoal = false;
    ball.scored = false;

    const dx = tx - ball.x;
    const dy = ty - ball.y;
    let speed = 600 + powerLevel * 700;
    // choose shot type randomly
    const types = ['power','curve','knuckle','finesse'];
    shotType = types[Math.floor(Math.random() * types.length)];
    if (shotType === 'power') speed *= 1.25;
    if (shotType === 'curve') ball.spin = (Math.random() > 0.5 ? 1 : -1) * 450;
    if (shotType === 'knuckle') { speed *= 1.1; ball.spin = 0; }
    if (shotType === 'finesse') { speed *= 0.9; ball.spin = (Math.random() - 0.5) * 180; }

    const distance = Math.sqrt(dx*dx + dy*dy);
    const timeToGoal = Math.max(0.2, distance / speed);
    ball.vx = dx / timeToGoal;
    ball.vy = (dy / timeToGoal) - (0.5 * CONFIG.gravity * timeToGoal);
    ball.vz = 0;
    ball.active = true;

    attempts++;
    updateStats();

    playSound(200, 0.2, 'sine');
    // clear AI charge UI and release pending after a small buffer
    if (powerFill) setTimeout(() => { powerFill.style.width = '0%'; }, 400);
    // after shot scheduled, clear pending after a small buffer so aiLoop can schedule next
    setTimeout(() => { aiPending = false; }, 1200);
  }, 600 + Math.random() * 800);
}

// If in keeper mode, schedule AI shoots when idle
function aiLoop() {
  if (gameMode === 'keeper' && !ball.active && !aiPending && !aiScheduled) {
    aiScheduled = true;
    // schedule AI shot after short randomized wait, then start a visible countdown
    const wait = 500 + Math.random() * 1200;
    setTimeout(() => {
      aiScheduled = false;
      // start countdown (2-3s) so player has time to position
      const countdownMs = 2000 + Math.random() * 1000;
      aiCountdownEnd = Date.now() + countdownMs;
      aiPending = true; // indicates a shot is pending (countdown running)
    }, wait);
  }
}

function resetGame() {
  ball.x = CONFIG.width / 2;
  ball.y = CONFIG.height - 100;
  ball.z = 0;
  ball.vx = 0;
  ball.vy = 0;
  ball.vz = 0;
  ball.spin = 0;
  ball.active = false;
  ball.missedGoal = false;
  ball.inGoal = false;
  ball.scored = false;
  ball.trail = [];
  
  keeper.x = CONFIG.goalX + CONFIG.goalWidth / 2;
  keeper.y = CONFIG.goalY + CONFIG.goalHeight - 30;
  keeper.diving = false;
  keeper.deflecting = false;
  keeper.rotation = 0;
}

function updateStats() {
  document.getElementById('goals').textContent = `${goals} / ${attempts}`;
  document.getElementById('streak').textContent = streak;
}

// Physics update with 3D depth
function update(dt) {
  if (isCharging) {
    const chargeTime = (Date.now() - chargeStartTime) / 1000;
    power = Math.min(1, chargeTime / 1.2);
    if (powerFill) powerFill.style.width = (power * 100) + '%';
  }
  
  if (ball.active) {
    // Gravity
    ball.vy += CONFIG.gravity * dt;
    
    // Spin effect
    if (shotType === 'curve') {
      ball.vx += ball.spin * dt * 1.2;
    } else if (shotType === 'knuckle') {
      ball.vx += (Math.random() - 0.5) * 800 * dt;
      ball.vy += (Math.random() - 0.5) * 400 * dt;
    }
    
    // Update position
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    
    // If ball entered goal, move into net (z-depth)
    if (ball.inGoal) {
      // advance into net
      ball.z += ball.vz * dt;
      // Slight dampening but keep motion so ball sinks into net smoothly
      const friction = 0.95;
      ball.vx *= friction;
      ball.vy *= friction;
      ball.vz *= friction;
      // slow sideways movement when entering net
      ball.vx *= 0.98;

      // Stop when deep enough or very slow
      if (Math.abs(ball.z) > 180 || Math.abs(ball.vz) < 8) {
        ball.vx = 0;
        ball.vy = 0;
        ball.vz = 0;
        ball.active = false;

        if (!ball.scored) {
          ball.scored = true;
          // Goal celebration
          setTimeout(() => {
            goals++;
            updateStats();

            // Check if game is over (5 attempts)
            if (attempts >= 5) {
              setTimeout(() => {
                alert(`Game Over! Final Score: ${goals} / ${attempts}\nStreak: ${streak}`);
                // Reset everything
                goals = 0;
                attempts = 0;
                streak = 0;
                updateStats();
                resetGame();
              }, 500);
            } else {
              resetGame();
            }
          }, 500);
        }
      }
    }
    
    // Add to trail
    ball.trail.push({ x: ball.x, y: ball.y, z: ball.z });
    if (ball.trail.length > 20) ball.trail.shift();
    
    // Check if ball has reached goal area
    if (ball.y <= CONFIG.goalY + CONFIG.goalHeight && !ball.missedGoal && !ball.inGoal) {
      // Check if inside goal boundaries
      if (ball.x > CONFIG.goalX + 20 && 
          ball.x < CONFIG.goalX + CONFIG.goalWidth - 20 &&
          ball.y > CONFIG.goalY + 10 && 
          ball.y < CONFIG.goalY + CONFIG.goalHeight - 10) {
        // Goal! Start going into net
        ball.inGoal = true;
        ball.vz = -Math.abs(ball.vy) * 0.8; // Move into goal depth
        playSound(600, 0.5);
        streak++;
        updateStats();
        return;
      } else if (ball.y <= CONFIG.goalY) {
        // Missed - turn ball red
        ball.missedGoal = true;
        streak = 0;
        updateStats();
      }
    }
    
    // Check keeper collision with deflection (make save chance scale with difficulty)
    if ((keeper.diving || keeper.deflecting) && !keeper.deflecting) {
      const dist = Math.sqrt((ball.x - keeper.x) ** 2 + (ball.y - keeper.y) ** 2);
      const difficulty = parseInt(difficultySlider.value);
      const saveRadius = 70 + difficulty * 8; // higher difficulty -> larger save radius
      if (dist < saveRadius) {
        // Save with deflection!
        keeper.deflecting = true;
        keeper.deflectTime = Date.now();
        
        // Deflect ball away
        const angle = Math.atan2(ball.y - keeper.y, ball.x - keeper.x);
        // Ensure ball is no longer considered 'in the goal'
        ball.inGoal = false;
        ball.scored = false;
        ball.missedGoal = true; // Turn red after save
        ball.vz = 0;
        ball.z = 0;

        // Push ball outwards from keeper and slightly downwards
        ball.vx = Math.cos(angle) * 600;
        ball.vy = Math.sin(angle) * 450 + 300; // stronger bounce away and down
        // Nudge position so it visibly appears deflected away
        ball.x = keeper.x + Math.cos(angle) * 40;
        ball.y = keeper.y + Math.sin(angle) * 40;
        
        streak = 0;
        playSound(300, 0.3);
        
        setTimeout(() => {
          ball.active = false;
          updateStats();
          
          // Check if game is over (5 attempts)
          if (attempts >= 5) {
            setTimeout(() => {
              alert(`Game Over! Final Score: ${goals} / ${attempts}`);
              // Reset everything
              goals = 0;
              attempts = 0;
              streak = 0;
              updateStats();
              resetGame();
            }, 500);
          } else {
            setTimeout(() => {
              resetGame();
            }, 800);
          }
        }, 600);
        return;
      }
    }
    
    // Out of bounds
    if (ball.y > CONFIG.height + 100 || ball.x < -100 || ball.x > CONFIG.width + 100 || ball.y < -100) {
      if (!ball.missedGoal && !ball.inGoal) {
        streak = 0;
        updateStats();
      }
      ball.active = false;
      
      // Check if game is over (5 attempts)
      if (attempts >= 5) {
        setTimeout(() => {
          alert(`Game Over! Final Score: ${goals} / ${attempts}`);
          // Reset everything
          goals = 0;
          attempts = 0;
          streak = 0;
          updateStats();
          resetGame();
        }, 500);
      } else {
        setTimeout(() => {
          resetGame();
        }, 1000);
      }
    }
  }
  
  // Update keeper
  const baseY = CONFIG.goalY + CONFIG.goalHeight - 30; // keeper baseline near the ground
  if (keeper.diving) {
    const elapsed = (Date.now() - keeper.diveTime) / 1000;
    const diveDuration = keeper.diveDuration || 0.6;
    const progress = Math.min(1, elapsed / diveDuration);

    // Smooth dive motion (interpolate from start -> target) - snappier curve
    const easeProgress = 1 - Math.pow(1 - progress, 4);
    keeper.x = (keeper.startX || keeper.x) + (keeper.targetX - (keeper.startX || keeper.x)) * easeProgress;
    keeper.y = (keeper.startY || keeper.y) + (keeper.targetY - (keeper.startY || keeper.y)) * easeProgress;

    // End diving state when reached
    if (progress >= 1) { keeper.diving = false; keeper.playerDive = false; keeper.y = baseY; keeper.rotation = 0; }
  } else if (!keeper.deflecting) {
    if (gameMode === 'shooter') {
      // Idle animation when player is shooter (small bob near ground)
      keeper.x = CONFIG.goalX + CONFIG.goalWidth / 2 + Math.sin(Date.now() / 800) * 12;
      keeper.y = baseY + Math.sin(Date.now() / 600) * 4;
    } else {
      // In keeper mode, allow keyboard movement only when not diving (player nor AI)
      const moveSpeed = 420; // px/sec
      if (!keeper.diving && !keeper.playerDive && !aiPending && !aiScheduled) {
        if (keys.left) keeper.x -= moveSpeed * dt;
        if (keys.right) keeper.x += moveSpeed * dt;
      }
      // keep within goal bounds
      keeper.x = Math.max(CONFIG.goalX + 30, Math.min(CONFIG.goalX + CONFIG.goalWidth - 30, keeper.x));
      keeper.y = baseY;
    }
  }
  
  // Reset deflecting state
  if (keeper.deflecting && (Date.now() - keeper.deflectTime) > 1000) {
    keeper.deflecting = false;
  }
}

// Draw function with 3D perspective
function draw() {
  // Clear - dark field base
  ctx.fillStyle = '#020014';
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

  // Sky gradient (subtle)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.goalY + CONFIG.goalHeight);
  skyGrad.addColorStop(0, '#070018');
  skyGrad.addColorStop(0.6, '#02102a');
  skyGrad.addColorStop(1, '#01000a');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.goalY + CONFIG.goalHeight);

  // Field with solid deep tone
  ctx.fillStyle = '#041125';
  ctx.fillRect(0, CONFIG.goalY + CONFIG.goalHeight, CONFIG.width, CONFIG.height);

  // Field line (neon)
  ctx.strokeStyle = 'rgba(0,255,246,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, CONFIG.goalY + CONFIG.goalHeight);
  ctx.lineTo(CONFIG.width, CONFIG.goalY + CONFIG.goalHeight);
  ctx.stroke();

  // Penalty spot (neon)
  ctx.beginPath();
  ctx.arc(CONFIG.width / 2, CONFIG.height - 100, 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,255,246,0.9)';
  ctx.fill();
  
  // Goal frame with 3D depth
  drawGoal3D();
  
  // Target crosshair (neon)
  if (!ball.active) {
    ctx.strokeStyle = 'rgba(0,255,246,0.95)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(targetPoint.x, targetPoint.y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(targetPoint.x - 22, targetPoint.y);
    ctx.lineTo(targetPoint.x + 22, targetPoint.y);
    ctx.moveTo(targetPoint.x, targetPoint.y - 22);
    ctx.lineTo(targetPoint.x, targetPoint.y + 22);
    ctx.stroke();
  }
  
  // Goalkeeper with animation
  drawGoalkeeper();
  
  // Ball with trail
  drawBall3D();

  // Debug HUD (confirm canvas is rendering)
  ctx.save();
  ctx.fillStyle = 'rgba(0,255,246,0.95)';
  ctx.font = '20px Orbitron, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText('Neon Strike', 18, 12);
  // Draw AI countdown if pending
  if (aiPending && aiCountdownEnd) {
    const msLeft = Math.max(0, aiCountdownEnd - Date.now());
    const sec = Math.ceil(msLeft / 1000);
    ctx.fillStyle = 'rgba(255,45,212,0.95)';
    ctx.font = '28px Orbitron, sans-serif';
    ctx.fillText(`AI fires in ${sec}`, CONFIG.width - 220, 12);
  }
  ctx.restore();
}

function drawGoal3D() {
  // Goal depth/shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.fillRect(CONFIG.goalX - 5, CONFIG.goalY - 5, CONFIG.goalWidth + 10, CONFIG.goalHeight + 10);
  
  // Net
  ctx.strokeStyle = 'rgba(0,255,246,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 12; i++) {
    const x = CONFIG.goalX + (CONFIG.goalWidth / 12) * i;
    ctx.beginPath();
    ctx.moveTo(x, CONFIG.goalY);
    ctx.lineTo(x - 8, CONFIG.goalY + CONFIG.goalHeight);
    ctx.stroke();
  }
  for (let i = 0; i <= 10; i++) {
    const y = CONFIG.goalY + (CONFIG.goalHeight / 10) * i;
    ctx.beginPath();
    ctx.moveTo(CONFIG.goalX, y);
    ctx.lineTo(CONFIG.goalX + CONFIG.goalWidth, y);
    ctx.stroke();
  }
  
  // Goal posts (white)
  ctx.fillStyle = 'rgba(0,255,246,0.95)';
  // Left post
  ctx.fillRect(CONFIG.goalX - 8, CONFIG.goalY, 8, CONFIG.goalHeight + 8);
  // Right post
  ctx.fillRect(CONFIG.goalX + CONFIG.goalWidth, CONFIG.goalY, 8, CONFIG.goalHeight + 8);
  // Top bar
  ctx.fillRect(CONFIG.goalX - 8, CONFIG.goalY - 8, CONFIG.goalWidth + 16, 8);
  
  // Post highlights
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(CONFIG.goalX - 6, CONFIG.goalY, 2, CONFIG.goalHeight);
  ctx.fillRect(CONFIG.goalX + CONFIG.goalWidth, CONFIG.goalY, 2, CONFIG.goalHeight);
}

function drawGoalkeeper() {
  ctx.save();
  ctx.translate(keeper.x, keeper.y);
  
  if (keeper.diving || keeper.deflecting) {
    ctx.rotate(keeper.rotation);
  }
  
  // Shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 50, 35, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Body
  ctx.fillStyle = 'rgba(255,45,212,0.95)';
  if (keeper.deflecting) {
    // Extended pose when deflecting - wider and slightly taller
    ctx.fillRect(-50, -40, 100, 60);
    // Arms extended
    ctx.fillRect(-70, -30, 22, 18);
    ctx.fillRect(48, -30, 22, 18);
    // Gloves
    ctx.fillStyle = 'rgba(126,255,161,0.95)';
    ctx.beginPath(); ctx.arc(-80, -12, 14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(70, -12, 14, 0, Math.PI * 2); ctx.fill();
  } else {
    // Taller body for more human-like proportions
    ctx.fillRect(-30, -50, 60, 90);
    // Arms (longer)
    ctx.fillRect(-50, -35, 18, 36);
    ctx.fillRect(32, -35, 18, 36);
    // Legs
    ctx.fillRect(-18, 50, 14, 30);
    ctx.fillRect(4, 50, 14, 30);

    // Head
    ctx.beginPath();
    ctx.arc(0, -65, 18, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd8b0';
    ctx.fill();

    // Gloves
    ctx.fillStyle = 'rgba(126,255,161,0.95)';
    ctx.beginPath(); ctx.arc(-60, -15, 14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(60, -15, 14, 0, Math.PI * 2); ctx.fill();
    // restore main fill style
    ctx.fillStyle = 'rgba(255,45,212,0.95)';
  }
  
  ctx.restore();
}

function drawBall3D() {
  // Draw trail with depth perspective
  ctx.save();
  for (let i = 0; i < ball.trail.length; i++) {
    const t = ball.trail[i];
    const alpha = (i / ball.trail.length) * 0.2;
    
    // Scale based on depth - farther into goal = smaller
    const depthScale = 1 - (Math.abs(t.z || 0) / 200) * 0.5;
    const size = CONFIG.ballRadius * (0.5 + (i / ball.trail.length) * 0.5) * depthScale;
    
    // Offset position based on depth for 3D effect
    const depthOffset = (t.z || 0) * 0.15;
    
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(t.x - depthOffset, t.y + depthOffset * 0.5, size, 0, Math.PI * 2);
    ctx.fillStyle = ball.missedGoal ? '#ff6b6b' : '#e0e0e0';
    ctx.fill();
  }
  ctx.restore();
  
  // Calculate depth scale for 3D effect
  const depthScale = 1 - (Math.abs(ball.z) / 200) * 0.6;
  const ballSize = CONFIG.ballRadius * depthScale;
  const depthOffset = ball.z * 0.15;
  
  // Ball shadow on field/net
  if (ball.y > CONFIG.goalY + CONFIG.goalHeight || ball.inGoal) {
    ctx.save();
    ctx.globalAlpha = 0.3 * depthScale;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    const shadowX = ball.x - depthOffset;
    const shadowY = ball.y + depthOffset * 0.5 + 20;
    ctx.ellipse(shadowX, shadowY, ballSize * 1.2, ballSize * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  
  // Ball with depth offset for 3D
  const drawX = ball.x - depthOffset;
  const drawY = ball.y + depthOffset * 0.5;
  
  ctx.save();
  ctx.beginPath();
  ctx.arc(drawX, drawY, ballSize, 0, Math.PI * 2);
  
  // Ball color - green if scored in goal, red if missed
  const gradient = ctx.createRadialGradient(
    drawX - ballSize * 0.3, 
    drawY - ballSize * 0.3, 
    ballSize * 0.1, 
    drawX, 
    drawY, 
    ballSize
  );
  
  if (ball.inGoal && !ball.active) {
    // Green for successful goal
    gradient.addColorStop(0, '#99ff99');
    gradient.addColorStop(0.5, '#44ff44');
    gradient.addColorStop(1, '#00cc00');
  } else if (ball.missedGoal) {
    // Red for missed
    gradient.addColorStop(0, '#ff9999');
    gradient.addColorStop(0.5, '#ff4444');
    gradient.addColorStop(1, '#cc0000');
  } else {
    // White for active
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.6, '#f0f0f0');
    gradient.addColorStop(1, '#cccccc');
  }
  
  ctx.fillStyle = gradient;
  ctx.fill();
  
  // Ball pattern
  ctx.strokeStyle = ball.missedGoal ? 'rgba(100, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0.15)';
  ctx.lineWidth = 2;
  const rotation = Date.now() / 500;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    const angle = (i / 5) * Math.PI * 2 + rotation;
    const x1 = drawX + Math.cos(angle) * ballSize * 0.7;
    const y1 = drawY + Math.sin(angle) * ballSize * 0.7;
    const x2 = drawX - Math.cos(angle) * ballSize * 0.7;
    const y2 = drawY - Math.sin(angle) * ballSize * 0.7;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  
  ctx.restore();
}

// Game loop
let lastTime = Date.now();
function gameLoop() {
  const now = Date.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  
  update(dt);
  draw();
  // run AI loop each frame (it will only act when appropriate)
  aiLoop();
  // If AI countdown finished, fire the shot
  if (aiPending && aiCountdownEnd && Date.now() >= aiCountdownEnd) {
    aiPending = false;
    aiCountdownEnd = 0;
    aiShoot();
  }
  
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
