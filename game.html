<script>
// Core setup
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('game-overlay');
const startButton = document.getElementById('start-button');
const scoreboard = document.getElementById('scoreboard');
const controlsInfo = document.getElementById('controls-info');
const teamAScoreEl = document.getElementById('teamA-score');
const teamBScoreEl = document.getElementById('teamB-score');

let gameStarted = false;
let keys = {};
let selectedIdx = 0; // Which of your team is controlled
let teams = [[],[]];
let ball;
let slideTackles = []; // Array to track active slide tackles
let score = {teamA:0, teamB:0};
const winningScore = 5;

const MAIN_PLAYER_SPEED = 7;
const AI_PLAYER_SPEED = 9; // Balanced AI speed
const SLIDE_TACKLE_SPEED = 10; // Speed of slide tackle
const SLIDE_TACKLE_DURATION = 30; // Frames slide tackle lasts
const SLIDE_TACKLE_COOLDOWN = 90; // Frames before next slide tackle
const GOALKEEPER_SPEED = 15; // Very fast goalkeeper
const GOALKEEPER_REACTION_TIME = 0.1; // How quickly keeper reacts (lower = faster)

// Color scheme
const TEAM_A_COLOR = "#ff0000";        // Bright Red
const TEAM_A_ACCENT = "#ffffff";       // White
const TEAM_A_SECOND = "#0000ff";       // Blue
const TEAM_B_COLOR = "#0000ff";        // Bright Blue
const TEAM_B_ACCENT = "#ffffff";       // White
const TEAM_B_SECOND = "#ff0000";       // Red
const PITCH_LINE = "#ffffff";          // White lines
const BALL_COLOR = "#ffffff";          // White ball
const GOAL_COLOR = "#ffffff";
const SLIDE_TACKLE_COLOR = "#ffff00";  // Yellow for slide tackle
const GOALKEEPER_COLOR = "#ffff00";    // Bright yellow for goalkeeper
const GOALKEEPER_ACCENT = "#000000";   // Black accents for goalkeeper

// Goalkeeper specific variables
let goalkeeper = null;
let lastBallSpeedX = 0;
let lastBallSpeedY = 0;

// INPUT
document.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    // player switch (Tab)
    if (e.key === "Tab") {
        e.preventDefault();
        selectedIdx = (selectedIdx+1)%teams[0].length;
    }
    // Slide tackle (Q)
    if (e.key.toLowerCase() === 'q') {
        e.preventDefault();
        attemptSlideTackle();
    }
});
document.addEventListener('keyup',e=>{
    keys[e.key.toLowerCase()]=false;
});

// START
startButton.addEventListener('click', () => {
    gameStarted = true;
    overlay.style.display = 'none';
    canvas.style.display = 'block';
    scoreboard.style.display = 'block';
    controlsInfo.style.display = 'block';
    resetGame(true);
    gameLoop();
});

// GAME LOOP
function gameLoop() {
    if (!gameStarted) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// RESET & INIT
function resetGame(fullReset){
    if(fullReset){
        score.teamA=0; score.teamB=0;
        teamAScoreEl.textContent='0';
        teamBScoreEl.textContent='0';
    }
    // Team setup: 4 per side (increased from 3)
    teams=[[],[]];
    const formationA = [
        {x:140,y:300},   // Striker
        {x:200,y:150},   // Left midfielder
        {x:200,y:450},   // Right midfielder
        {x:100,y:300}    // Defender
    ];
    const formationB = [
        {x:canvas.width-140,y:300},   // Striker
        {x:canvas.width-220,y:150},   // Left midfielder
        {x:canvas.width-220,y:450},   // Right midfielder
        {x:canvas.width-100,y:300}    // Defender
    ];
    for(let i=0;i<4;i++) {
        teams[0].push({
            x:formationA[i].x, 
            y:formationA[i].y, 
            width:36, 
            height:36, 
            color:TEAM_A_COLOR, 
            accent:TEAM_A_ACCENT, 
            second:TEAM_A_SECOND, 
            speed:MAIN_PLAYER_SPEED, 
            number:i+1, 
            hasBall:i===0, 
            lastDir:{x:1,y:0},
            tackleCooldown: 0,
            slideTackleCooldown: 0,
            isSliding: false,
            slideDir: {x:0,y:0},
            slideFrames: 0,
            role: i===0 ? 'striker' : i===1 ? 'leftMid' : i===2 ? 'rightMid' : 'defender'
        });
        teams[1].push({
            x:formationB[i].x, 
            y:formationB[i].y, 
            width:36, 
            height:36, 
            color:TEAM_B_COLOR, 
            accent:TEAM_B_ACCENT, 
            second:TEAM_B_SECOND, 
            speed:AI_PLAYER_SPEED, 
            number:i+5, 
            hasBall:false, 
            lastDir:{x:-1,y:0},
            tackleCooldown: 0,
            slideTackleCooldown: 0,
            isSliding: false,
            slideDir: {x:0,y:0},
            slideFrames: 0,
            role: i===0 ? 'striker' : i===1 ? 'leftMid' : i===2 ? 'rightMid' : 'defender',
            assignedPlayer: null
        });
    }
    
    // Initialize SUPER GOALKEEPER
    goalkeeper = {
        x: canvas.width - 70, // Position in goal area
        y: canvas.height/2,
        width: 40,
        height: 80, // Taller goalkeeper
        color: GOALKEEPER_COLOR,
        accent: GOALKEEPER_ACCENT,
        speed: GOALKEEPER_SPEED,
        number: 1,
        hasBall: false,
        reactionTime: GOALKEEPER_REACTION_TIME,
        divePower: 25, // How far/fast he can dive
        saveSkill: 0.95, // 95% chance to save shots in his reach
        isDiving: false,
        diveDirection: {x:0, y:0},
        diveFrames: 0,
        maxDiveFrames: 20
    };
    
    selectedIdx = 0;
    slideTackles = [];
    ball = {
        x:teams[0][0].x+teams[0][0].width+14,
        y:teams[0][0].y+teams[0][0].height/2,
        radius:13, color:BALL_COLOR, speedX:0, speedY:0, friction:0.98
    };
    
    // Assign defensive marking
    assignDefensiveMarking();
}

function assignDefensiveMarking() {
    // Assign each AI player to mark a specific opponent
    teams[1][0].assignedPlayer = teams[0][0]; // Striker marks their striker
    teams[1][1].assignedPlayer = teams[0][1]; // Left mid marks their left mid
    teams[1][2].assignedPlayer = teams[0][2]; // Right mid marks their right mid
    teams[1][3].assignedPlayer = teams[0][3]; // Defender marks their defender
}

function update(){
    moveSelectedPlayer();
    moveAIPlayers();
    updateGoalkeeper();
    updateSlideTackles();
    moveBall();
    checkCollisions();
    checkGoal();
    checkGoalkeeperSave();
    
    // Update tackle cooldowns
    updateTackleCooldowns();
}

function updateTackleCooldowns() {
    for(let t=0;t<2;t++){
        for(let i=0;i<teams[t].length;i++){
            if(teams[t][i].tackleCooldown > 0) {
                teams[t][i].tackleCooldown--;
            }
            if(teams[t][i].slideTackleCooldown > 0) {
                teams[t][i].slideTackleCooldown--;
            }
            // Update slide animation
            if(teams[t][i].isSliding) {
                teams[t][i].slideFrames--;
                if(teams[t][i].slideFrames <= 0) {
                    teams[t][i].isSliding = false;
                    teams[t][i].slideTackleCooldown = SLIDE_TACKLE_COOLDOWN;
                }
            }
        }
    }
    
    // Update goalkeeper dive
    if (goalkeeper.isDiving) {
        goalkeeper.diveFrames--;
        if (goalkeeper.diveFrames <= 0) {
            goalkeeper.isDiving = false;
        }
    }
}

function moveSelectedPlayer(){
    let player = teams[0][selectedIdx];
    
    // Don't move if sliding
    if(player.isSliding) {
        // Continue sliding in the slide direction
        player.x += player.slideDir.x * SLIDE_TACKLE_SPEED;
        player.y += player.slideDir.y * SLIDE_TACKLE_SPEED;
        
        // Keep within bounds
        player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        return;
    }
    
    let moved=false;
    player.lastDir={x:0,y:0};
    if(keys['arrowup'] && player.y>0){player.y-=player.speed; player.lastDir.y=-1; moved=true;}
    if(keys['arrowdown'] && player.y<canvas.height-player.height){player.y+=player.speed; player.lastDir.y=1; moved=true;}
    if(keys['arrowleft'] && player.x>0){player.x-=player.speed; player.lastDir.x=-1; moved=true;}
    if(keys['arrowright'] && player.x<canvas.width-player.width){player.x+=player.speed; player.lastDir.x=1; moved=true;}
    if(moved && player.lastDir.x===0&&player.lastDir.y===0) player.lastDir.x=1;

    // Dribble
    if (player.hasBall) {
        let dx=player.lastDir.x||1, dy=player.lastDir.y||0;
        ball.x=player.x+player.width/2+dx*(player.width/2+ball.radius);
        ball.y=player.y+player.height/2+dy*(player.height/2+ball.radius);
        ball.speedX=ball.speedY=0;
    }
    // Shoot
    if(keys[' ']&&player.hasBall){
        player.hasBall=false;
        ball.speedX=player.lastDir.x*20||20;
        ball.speedY=player.lastDir.y*15||0;
    }
}

// SUPER GOALKEEPER AI
function updateGoalkeeper() {
    if (!goalkeeper) return;
    
    // Track ball speed for prediction
    lastBallSpeedX = ball.speedX;
    lastBallSpeedY = ball.speedY;
    
    // Only move goalkeeper if ball is in his half
    if (ball.x > canvas.width/2) {
        // Predict where the ball will be if shot toward goal
        let predictedY = ball.y;
        let ballSpeed = Math.sqrt(ball.speedX*ball.speedX + ball.speedY*ball.speedY);
        
        // If ball is moving fast toward goal, predict intercept point
        if (ball.speedX < -10) { // Ball moving left toward goal
            let framesToGoal = (ball.x - 24) / Math.abs(ball.speedX);
            predictedY = ball.y + (ball.speedY * framesToGoal);
            
            // Constrain prediction to goal area
            predictedY = Math.max(canvas.height/2 - 80, Math.min(canvas.height/2 + 80, predictedY));
        }
        
        // Move toward predicted position or ball position
        let targetY = predictedY;
        
        // If ball is in penalty area, be more aggressive
        if (ball.x > canvas.width - 100) {
            targetY = ball.y;
        }
        
        // Smooth movement with anticipation
        let dy = targetY - goalkeeper.y;
        goalkeeper.y += dy * goalkeeper.reactionTime;
        
        // Keep goalkeeper within goal bounds
        goalkeeper.y = Math.max(canvas.height/2 - 70, Math.min(canvas.height/2 + 70, goalkeeper.y));
        
        // Perform dive if ball is close and moving fast toward goal
        if (!goalkeeper.isDiving && ballSpeed > 15 && ball.speedX < -12 && ball.x > canvas.width - 150) {
            // Calculate if dive is needed
            let ballToGoalCenterDist = Math.abs(ball.y - canvas.height/2);
            let keeperToBallDist = Math.abs(goalkeeper.y - ball.y);
            
            if (keeperToBallDist > 40 || ballToGoalCenterDist > 50) {
                // Perform dive toward ball
                goalkeeper.isDiving = true;
                goalkeeper.diveFrames = goalkeeper.maxDiveFrames;
                goalkeeper.diveDirection = {
                    x: -1, // Always dive toward ball
                    y: (ball.y - goalkeeper.y) > 0 ? 1 : -1
                };
            }
        }
        
        // Update position if diving
        if (goalkeeper.isDiving) {
            goalkeeper.x += goalkeeper.diveDirection.x * goalkeeper.divePower * 0.8;
            goalkeeper.y += goalkeeper.diveDirection.y * goalkeeper.divePower;
        } else {
            // Return to goal position when not diving
            goalkeeper.x = canvas.width - 70;
        }
        
        // Constrain goalkeeper position
        goalkeeper.x = Math.max(canvas.width - 90, Math.min(canvas.width - 50, goalkeeper.x));
    }
}

// Check if goalkeeper saves a shot
function checkGoalkeeperSave() {
    if (!goalkeeper || findPlayerWithBall()) return false;
    
    // Only check saves when ball is in goal area
    if (ball.x > canvas.width - 50 && ball.y > canvas.height/2 - 90 && ball.y < canvas.height/2 + 90) {
        // Check collision with goalkeeper
        if (rectCircleCollision(goalkeeper, ball)) {
            // SUPER GOALKEEPER: Very high save probability
            let saveProbability = goalkeeper.saveSkill;
            
            // Adjust based on shot speed and angle
            let shotSpeed = Math.sqrt(ball.speedX*ball.speedX + ball.speedY*ball.speedY);
            let angleToCenter = Math.abs(ball.y - canvas.height/2) / 90; // 0 to 1
            
            // Harder to save fast shots to corners
            if (shotSpeed > 20 && angleToCenter > 0.7) {
                saveProbability *= 0.85; // 85% of normal save skill
            }
            
            if (Math.random() < saveProbability) {
                // SAVE!
                // Calculate rebound angle
                let reboundAngle = Math.atan2(ball.speedY, ball.speedX);
                reboundAngle += Math.PI + (Math.random() - 0.5) * 0.5; // Reverse with some randomness
                
                let reboundSpeed = Math.min(30, shotSpeed * 0.8 + 10); // Powerful rebound
                
                ball.speedX = Math.cos(reboundAngle) * reboundSpeed;
                ball.speedY = Math.sin(reboundAngle) * reboundSpeed;
                
                // Add some visual feedback
                createSaveEffect();
                
                return true;
            }
        }
    }
    return false;
}

function createSaveEffect() {
    // Create visual effect for save
    for(let i = 0; i < 10; i++) {
        setTimeout(() => {
            slideTackles.push({
                x: goalkeeper.x + goalkeeper.width/2,
                y: goalkeeper.y + goalkeeper.height/2,
                radius: 15 + Math.random() * 20,
                frames: 15,
                color: "#ffff00"
            });
        }, i * 30);
    }
}

// Attempt slide tackle with Q key
function attemptSlideTackle() {
    let player = teams[0][selectedIdx];
    
    // Check if slide tackle is available (not on cooldown and not already sliding)
    if(player.slideTackleCooldown > 0 || player.isSliding || player.hasBall) {
        return;
    }
    
    // Start slide tackle
    player.isSliding = true;
    player.slideFrames = SLIDE_TACKLE_DURATION;
    
    // Set slide direction based on last movement direction
    if(player.lastDir.x === 0 && player.lastDir.y === 0) {
        player.slideDir = {x:1, y:0}; // Default to right if no movement
    } else {
        player.slideDir = {x:player.lastDir.x, y:player.lastDir.y};
    }
    
    // Normalize slide direction
    let len = Math.sqrt(player.slideDir.x**2 + player.slideDir.y**2);
    if(len > 0) {
        player.slideDir.x /= len;
        player.slideDir.y /= len;
    }
    
    // Add visual effect
    slideTackles.push({
        x: player.x + player.width/2,
        y: player.y + player.height/2,
        radius: 25,
        frames: SLIDE_TACKLE_DURATION
    });
}

function updateSlideTackles() {
    // Update slide tackle visual effects
    for(let i = slideTackles.length - 1; i >= 0; i--) {
        slideTackles[i].frames--;
        if(slideTackles[i].frames <= 0) {
            slideTackles.splice(i, 1);
        }
    }
    
    // Check for slide tackle collisions
    for(let t = 0; t < 2; t++) {
        for(let i = 0; i < teams[t].length; i++) {
            let player = teams[t][i];
            if(player.isSliding) {
                // Check collision with opponents
                let opponentTeam = t === 0 ? teams[1] : teams[0];
                for(let j = 0; j < opponentTeam.length; j++) {
                    let opponent = opponentTeam[j];
                    if(opponent.hasBall && rectRectCollision(player, opponent)) {
                        // Successful slide tackle!
                        opponent.hasBall = false;
                        player.hasBall = true;
                        
                        // Knock the opponent back
                        let knockbackX = (opponent.x - player.x) * 0.5;
                        let knockbackY = (opponent.y - player.y) * 0.5;
                        opponent.x += knockbackX;
                        opponent.y += knockbackY;
                        
                        // Keep opponent in bounds
                        opponent.x = Math.max(0, Math.min(canvas.width - opponent.width, opponent.x));
                        opponent.y = Math.max(0, Math.min(canvas.height - opponent.height, opponent.y));
                        
                        // Add ball physics
                        ball.speedX = knockbackX * 2;
                        ball.speedY = knockbackY * 2;
                        
                        // End slide tackle early
                        player.isSliding = false;
                        player.slideFrames = 0;
                        player.slideTackleCooldown = SLIDE_TACKLE_COOLDOWN;
                    }
                }
            }
        }
    }
}

// Enhanced AI for opponents with proper positioning and ACTIVE DEFENSE
function moveAIPlayers(){
    // Team A (your team's AI, excluding controlled)
    for(let i=0;i<teams[0].length;i++){
        if(i===selectedIdx) continue;
        let p=teams[0][i];
        // Don't move if sliding
        if(p.isSliding) {
            p.x += p.slideDir.x * SLIDE_TACKLE_SPEED;
            p.y += p.slideDir.y * SLIDE_TACKLE_SPEED;
            p.x = Math.max(0, Math.min(canvas.width - p.width, p.x));
            p.y = Math.max(0, Math.min(canvas.height - p.height, p.y));
            continue;
        }
        
        // AI possession: Auto pass to controlled player if they get ball
        if(p.hasBall){
            let target = teams[0][selectedIdx];
            // Pass towards selected
            let dx = target.x - p.x, dy=target.y-p.y, len=Math.sqrt(dx*dx+dy*dy);
            dx/=len; dy/=len;
            p.hasBall=false;
            ball.speedX = dx*15;
            ball.speedY = dy*12;
        } else {
            // Move toward ball, only if ball is in own half or free
            let dx=ball.x-p.x,dy=ball.y-p.y,len=Math.sqrt(dx*dx+dy*dy);
            if(len>1){ dx/=len; dy/=len; }
            if(p.x<canvas.width/2-20||(dx>0)){
                p.x+=p.speed*dx*0.25;
                p.y+=p.speed*dy*0.25;
            }
        }
    }
    
    // Enhanced Team B AI with ACTIVE DEFENSE
    teams[1].forEach((p, index) => {
        // Don't move if sliding
        if(p.isSliding) {
            p.x += p.slideDir.x * SLIDE_TACKLE_SPEED;
            p.y += p.slideDir.y * SLIDE_TACKLE_SPEED;
            p.x = Math.max(0, Math.min(canvas.width - p.width, p.x));
            p.y = Math.max(0, Math.min(canvas.height - p.height, p.y));
            return;
        }
        
        // If has ball, make smarter decisions
        if(p.hasBall){
            // Calculate distance to goal
            let goalTarget = {x:40, y:canvas.height/2};
            let dx = goalTarget.x - p.x;
            let dy = goalTarget.y - p.y;
            let distToGoal = Math.sqrt(dx*dx+dy*dy);
            
            // Normalize direction
            dx/=distToGoal; 
            dy/=distToGoal;
            
            // Move toward goal with some randomness to make it less predictable
            p.x += p.speed * dx * (0.9 + Math.random()*0.2);
            p.y += p.speed * dy * (0.9 + Math.random()*0.2);
            
            // Dribble
            ball.x = p.x + p.width/2 + dx*(p.width/2 + ball.radius);
            ball.y = p.y + p.height/2 + dy*(p.height/2 + ball.radius);
            ball.speedX = ball.speedY = 0;
            
            // Smart shooting - higher probability when closer to goal
            let shootProbability = 0.02;
            if(distToGoal < 200) shootProbability = 0.05;
            if(distToGoal < 100) shootProbability = 0.08;
            
            // Also shoot if there's a clear path to goal
            let hasClearShot = checkClearShot(p);
            if(hasClearShot) shootProbability = 0.12;
            
            if(Math.random() < shootProbability || p.x < 150){
                p.hasBall = false;
                // More accurate shooting toward goal
                let goalX = 40 + (Math.random()-0.5)*30;
                let goalY = canvas.height/2 + (Math.random()-0.5)*60;
                let shotDx = goalX - p.x;
                let shotDy = goalY - p.y;
                let shotDist = Math.sqrt(shotDx*shotDx+shotDy*shotDy);
                shotDx /= shotDist;
                shotDy /= shotDist;
                
                ball.speedX = shotDx * (22 + Math.random()*4);
                ball.speedY = shotDy * (22 + Math.random()*4);
            }
        } else {
            // ACTIVE DEFENSE - AI will actively try to intercept and tackle
            
            // Check if player with ball is approaching
            let ballCarrier = findPlayerWithBall();
            let isBallCarrierApproaching = ballCarrier && 
                ballCarrier.x > canvas.width/2 && 
                ballCarrier.hasBall;
            
            // If ball carrier is approaching in AI's half, prioritize defense
            if (isBallCarrierApproaching) {
                let distToBallCarrier = Math.sqrt((ballCarrier.x - p.x)**2 + (ballCarrier.y - p.y)**2);
                
                // If close enough to ball carrier, actively defend
                if (distToBallCarrier < 200) {
                    // Move to intercept ball carrier
                    let interceptX = ballCarrier.x + ballCarrier.lastDir.x * 30;
                    let interceptY = ballCarrier.y + ballCarrier.lastDir.y * 30;
                    
                    let dx = interceptX - p.x;
                    let dy = interceptY - p.y;
                    let len = Math.sqrt(dx*dx+dy*dy);
                    
                    if(len > 0) {
                        dx /= len;
                        dy /= len;
                        // Aggressive defense when close
                        let defenseSpeed = distToBallCarrier < 80 ? 0.8 : 0.6;
                        p.x += p.speed * dx * defenseSpeed;
                        p.y += p.speed * dy * defenseSpeed;
                        
                        // ATTEMPT TACKLE when very close and not on cooldown
                        if (distToBallCarrier < 50 && p.tackleCooldown === 0) {
                            attemptTackle(p, ballCarrier);
                        }
                        
                        // AI slide tackle (occasionally)
                        if (distToBallCarrier < 60 && Math.random() < 0.005 && p.slideTackleCooldown === 0) {
                            attemptAISlideTackle(p, ballCarrier);
                        }
                    }
                } else {
                    // Position to cut off paths to goal
                    let goalX = canvas.width - 24;
                    let goalY = canvas.height/2;
                    
                    // Calculate interception point between ball carrier and goal
                    let t = 0.7; // How far along the path to position
                    let cutOffX = ballCarrier.x + (goalX - ballCarrier.x) * t;
                    let cutOffY = ballCarrier.y + (goalY - ballCarrier.y) * t;
                    
                    let dx = cutOffX - p.x;
                    let dy = cutOffY - p.y;
                    let len = Math.sqrt(dx*dx+dy*dy);
                    
                    if(len > 0) {
                        dx /= len;
                        dy /= len;
                        p.x += p.speed * dx * 0.5;
                        p.y += p.speed * dy * 0.5;
                    }
                }
            } else {
                // Without ball, use role-based positioning
                let ballDist = Math.sqrt((ball.x-p.x)**2 + (ball.y-p.y)**2);
                
                // Different behavior based on role
                if(p.role === 'striker') {
                    // Striker stays in offensive positions and pressures ball
                    if(ball.x > canvas.width/2 && ballDist < 300) {
                        // Pressure the ball when it's in attacking half
                        let dx = ball.x - p.x;
                        let dy = ball.y - p.y;
                        let len = Math.sqrt(dx*dx+dy*dy);
                        if(len !== 0) { dx/=len; dy/=len; }
                        p.x += p.speed * dx * 0.4;
                        p.y += p.speed * dy * 0.4;
                    } else {
                        // Maintain attacking position
                        let targetX = canvas.width/2 + 150 + Math.random()*50;
                        let targetY = canvas.height/2 + (Math.random()-0.5)*80;
                        let dx = targetX - p.x;
                        let dy = targetY - p.y;
                        let len = Math.sqrt(dx*dx+dy*dy);
                        if(len !== 0) { dx/=len; dy/=len; }
                        p.x += p.speed * dx * 0.3;
                        p.y += p.speed * dy * 0.3;
                    }
                } else if(p.role === 'leftMid' || p.role === 'rightMid') {
                    // Midfielder covers wing areas and supports both defense and attack
                    if(ballDist < 350) {
                        // Move toward ball but maintain positioning
                        let dx = ball.x - p.x;
                        let dy = ball.y - p.y;
                        let len = Math.sqrt(dx*dx+dy*dy);
                        if(len !== 0) { dx/=len; dy/=len; }
                        p.x += p.speed * dx * 0.35;
                        p.y += p.speed * dy * 0.35;
                    } else {
                        // Maintain wing position and mark assigned player
                        let target;
                        if(p.assignedPlayer && p.assignedPlayer.x > canvas.width/2 - 100) {
                            // Mark assigned player when they're in attacking position
                            target = {
                                x: p.assignedPlayer.x - 40,
                                y: p.assignedPlayer.y
                            };
                        } else {
                            // Default wing position
                            target = {
                                x: canvas.width/2 + 50,
                                y: p.role === 'leftMid' ? canvas.height/3 : 2*canvas.height/3
                            };
                        }
                        
                        let dx = target.x - p.x;
                        let dy = target.y - p.y;
                        let len = Math.sqrt(dx*dx+dy*dy);
                        if(len !== 0) { dx/=len; dy/=len; }
                        p.x += p.speed * dx * 0.25;
                        p.y += p.speed * dy * 0.25;
                    }
                } else if(p.role === 'defender') {
                    // Defender stays in defensive positions and marks players
                    if(ballDist < 300 || ball.x > canvas.width/2 - 100) {
                        // Defend when ball is in defensive half
                        let target;
                        if(p.assignedPlayer) {
                            // Mark assigned player
                            target = {
                                x: p.assignedPlayer.x - 30,
                                y: p.assignedPlayer.y
                            };
                        } else {
                            // Position between ball and goal
                            target = {
                                x: ball.x - 50,
                                y: ball.y
                            };
                        }
                        
                        // Don't get too close to own goal
                        target.x = Math.max(target.x, canvas.width - 350);
                        
                        let dx = target.x - p.x;
                        let dy = target.y - p.y;
                        let len = Math.sqrt(dx*dx+dy*dy);
                        if(len !== 0) { dx/=len; dy/=len; }
                        p.x += p.speed * dx * 0.4;
                        p.y += p.speed * dy * 0.4;
                    } else {
                        // Maintain defensive formation
                        let targetX = canvas.width - 250;
                        let targetY = canvas.height/2 + (index-3)*60;
                        let dx = targetX - p.x;
                        let dy = targetY - p.y;
                        let len = Math.sqrt(dx*dx+dy*dy);
                        if(len !== 0) { dx/=len; dy/=len; }
                        p.x += p.speed * dx * 0.2;
                        p.y += p.speed * dy * 0.2;
                    }
                }
            }
            
            // Intercept passes and shots
            if(ball.speedX !== 0 || ball.speedY !== 0) {
                let futureBallX = ball.x + ball.speedX * 10;
                let futureBallY = ball.y + ball.speedY * 10;
                let futureDist = Math.sqrt((futureBallX-p.x)**2 + (futureBallY-p.y)**2);
                
                if(futureDist < 100 && isInDefensiveArea(p)) {
                    let dx = futureBallX - p.x;
                    let dy = futureBallY - p.y;
                    let len = Math.sqrt(dx*dx+dy*dy);
                    if(len !== 0) { dx/=len; dy/=len; }
                    p.x += p.speed * dx * 0.4;
                    p.y += p.speed * dy * 0.4;
                }
            }
        }
    });
}

// AI slide tackle function
function attemptAISlideTackle(ai, ballCarrier) {
    if (!ballCarrier.hasBall || ai.slideTackleCooldown > 0) return;
    
    // Start slide tackle
    ai.isSliding = true;
    ai.slideFrames = SLIDE_TACKLE_DURATION;
    
    // Slide toward ball carrier
    let dx = ballCarrier.x - ai.x;
    let dy = ballCarrier.y - ai.y;
    let len = Math.sqrt(dx*dx + dy*dy);
    if(len > 0) {
        ai.slideDir = {x: dx/len, y: dy/len};
    } else {
        ai.slideDir = {x:1, y:0};
    }
    
    // Add visual effect
    slideTackles.push({
        x: ai.x + ai.width/2,
        y: ai.y + ai.height/2,
        radius: 25,
        frames: SLIDE_TACKLE_DURATION
    });
}

// NEW FUNCTION: Attempt tackle on ball carrier
function attemptTackle(defender, ballCarrier) {
    if (!ballCarrier.hasBall) return;
    
    // Calculate tackle success based on angle and distance
    let dx = ballCarrier.x - defender.x;
    let dy = ballCarrier.y - defender.y;
    let dist = Math.sqrt(dx*dx+dy*dy);
    
    if (dist < 50) { // Only attempt if very close
        // Higher success rate from behind or sides
        let successRate = 0.7; // 70% success rate when close
        
        if (Math.random() < successRate) {
            // Successful tackle!
            ballCarrier.hasBall = false;
            defender.hasBall = true;
            
            // Add some physics to the tackle
            ball.speedX = (Math.random()-0.5)*8;
            ball.speedY = (Math.random()-0.5)*8;
            
            // Set cooldown to prevent spam tackling
            defender.tackleCooldown = 30; // 0.5 seconds at 60fps
        } else {
            // Failed tackle - still set cooldown
            defender.tackleCooldown = 20;
        }
    }
}

// Check if AI is in defensive area
function isInDefensiveArea(ai) {
    return ai.x > canvas.width/2;
}

// Check if AI has a clear shot at goal
function checkClearShot(player) {
    // Simple check - if there are no opponents between player and goal
    let goalX = 40;
    let goalY = canvas.height/2;
    
    for(let i = 0; i < teams[0].length; i++) {
        let opponent = teams[0][i];
        // Simple line intersection check
        if(isBetween(opponent.x, player.x, goalX) && 
           isBetween(opponent.y, player.y, goalY) &&
           Math.abs((goalY - player.y)*(opponent.x - player.x) - (goalX - player.x)*(opponent.y - player.y)) < 100) {
            return false;
        }
    }
    return true;
}

// Helper function to check if value is between two others
function isBetween(value, a, b) {
    return (value >= Math.min(a, b) && value <= Math.max(a, b));
}

// Ball physics
function moveBall(){
    let carrier=findPlayerWithBall();
    if(carrier) return; // Ball is attached
    ball.x+=ball.speedX;ball.y+=ball.speedY;
    ball.speedX*=ball.friction; ball.speedY*=ball.friction;
    if(Math.abs(ball.speedX)<0.1)ball.speedX=0;
    if(Math.abs(ball.speedY)<0.1)ball.speedY=0;
    // Bounce walls
    if(ball.y-ball.radius<0){ball.y=ball.radius;ball.speedY*=-0.7;}
    if(ball.y+ball.radius>canvas.height){ball.y=canvas.height-ball.radius;ball.speedY*=-0.7;}
    if(ball.x-ball.radius<0){ball.x=ball.radius;ball.speedX*=-0.7;}
    if(ball.x+ball.radius>canvas.width){ball.x=canvas.width-ball.radius;ball.speedX*=-0.7;}
}

// Who has the ball?
function findPlayerWithBall(){
    for(let t=0;t<2;t++){
        for(let p=0;p<4;p++){
            if(teams[t][p].hasBall) return teams[t][p];
        }
    }
    return null;
}

// IMPROVED Collisions with better stealing
function checkCollisions(){
    let ballCarrier = findPlayerWithBall();
    for(let t=0;t<2;t++){
        for(let i=0;i<teams[t].length;i++){
            let p = teams[t][i];
            // Don't check collisions while sliding (handled separately)
            if(p.isSliding) continue;
            
            // Ball Pickup
            if(!p.hasBall && !ballCarrier && rectCircleCollision(p,ball)) {
                p.hasBall=true;
            }
            // IMPROVED: More effective stealing with cooldown
            if(p.hasBall && ballCarrier && ballCarrier!==p && rectCircleCollision(p,ball)){
                // Only attempt steal if not on cooldown
                if (ballCarrier.tackleCooldown === 0) {
                    let stealSuccess = Math.random() < 0.6; // 60% success rate
                    if (stealSuccess) {
                        ballCarrier.hasBall=false;
                        p.hasBall=true;
                        // Realistic tackle physics
                        ball.speedX = (t==0?1:-1) * 12;
                        ball.speedY = (Math.random()-0.5)*10;
                        // Set cooldown to prevent instant re-steal
                        ballCarrier.tackleCooldown = 15;
                    }
                }
            }
        }
    }
}

// Score logic: Each team scores on the opposing goal
function checkGoal(){
    // Team A scores in right goal (AI side with goalkeeper)
    if(ball.x + ball.radius > canvas.width-24 && ball.y > canvas.height/2-90 && ball.y < canvas.height/2+90){
        // Check if goalkeeper saved it
        if (!checkGoalkeeperSave()) {
            score.teamA++;
            teamAScoreEl.textContent = score.teamA;
            if(checkWin()) return;
            resetGame(false);
        }
    }
    // Team B scores in left goal (your side - no goalkeeper)
    if(ball.x-ball.radius < 24 && ball.y > canvas.height/2-90 && ball.y < canvas.height/2+90){
        score.teamB++;
        teamBScoreEl.textContent = score.teamB;
        if(checkWin()) return;
        resetGame(false);
    }
}

// Win Condition - overlay
function checkWin(){
    if(score.teamA>=winningScore||score.teamB>=winningScore){
        gameStarted=false;
        let winText = score.teamA>=winningScore ?
            `<span style='color:#fff'>AMAZING! You Beat the Super Keeper!</span>` :
            `<span style='color:#2fd771'>Opponent Wins!</span>`;
        overlay.innerHTML = `
            <div class="bg-gradient-to-br from-green-900 via-green-700 to-green-800 p-10 rounded-lg shadow-2xl text-center max-w-md border-4 border-red-600">
                <h1 class="text-3xl font-bold mb-5 text-white" style="font-family:'Press Start 2P',cursive;">${winText}</h1>
                <p class="mb-6 text-2xl"><span style="color:#fff">${score.teamA}</span> - <span style="color:#2fd771">${score.teamB}</span></p>
                <button id="restart-button" class="w-full bg-green-500 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-lg text-lg border-2 border-white shadow-md">
                    Play Again
                </button>
            </div>
        `;
        overlay.style.display = 'flex';
        document.getElementById('restart-button').addEventListener('click',()=> {
            gameStarted=true;
            overlay.style.display='none';
            resetGame(true);
            gameLoop();
        });
        return true;
    }
    return false;
}

// --- Drawing ---
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawPitch();
    drawPlayers();
    drawGoalkeeper();
    drawSlideTackles();
    drawBall();
}

function drawPlayers(){
    for(let t=0;t<2;t++){
        for(let i=0;i<teams[t].length;i++){
            let p = teams[t][i];
            ctx.save();
            
            // Different appearance when sliding
            if(p.isSliding) {
                ctx.fillStyle = SLIDE_TACKLE_COLOR;
                ctx.fillRect(p.x, p.y, p.width, p.height);
                
                // Draw slide trail
                ctx.globalAlpha = 0.5;
                ctx.fillStyle = "#ffff99";
                for(let j = 0; j < 3; j++) {
                    ctx.fillRect(
                        p.x - p.slideDir.x * 10 * (j+1),
                        p.y - p.slideDir.y * 10 * (j+1),
                        p.width,
                        p.height
                    );
                }
                ctx.globalAlpha = 1.0;
            } else {
                // Normal appearance
                // Accent strip: vertical line
                ctx.fillStyle = p.accent;
                ctx.fillRect(p.x+p.width/2-6,p.y,p.width/6, p.height);

                ctx.shadowColor = p.second;
                ctx.shadowBlur = 12;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x,p.y,p.width,p.height);
            }

            // Highlight selected player
            if(t==0 && i==selectedIdx) {
                ctx.lineWidth = 5;
                ctx.strokeStyle = p.isSliding ? "#ff9900" : "#ff1744";
                ctx.shadowColor = p.isSliding ? "#ff9900" : "#ff1744";
                ctx.shadowBlur = 17;
                ctx.strokeRect(p.x-4,p.y-4,p.width+8,p.height+8);
            }

            // Jersey Number
            ctx.fillStyle = (t==0 && i==selectedIdx) ? (p.isSliding ? "#ff9900" : "#ff1744") : "#111";
            ctx.font = "bold 18px 'Press Start 2P',cursive";
            ctx.textAlign="center";
            ctx.fillText(p.number, p.x+p.width/2, p.y+p.height/2+5);
            ctx.restore();
        }
    }
}

// Draw SUPER GOALKEEPER
function drawGoalkeeper() {
    if (!goalkeeper) return;
    
    ctx.save();
    
    // Goalkeeper appearance
    if (goalkeeper.isDiving) {
        // Diving animation
        ctx.fillStyle = "#ff9900"; // Brighter when diving
        ctx.shadowColor = "#ff9900";
        ctx.shadowBlur = 20;
    } else {
        ctx.fillStyle = goalkeeper.color;
        ctx.shadowColor = "#ffff00";
        ctx.shadowBlur = 15;
    }
    
    // Draw goalkeeper body
    ctx.fillRect(goalkeeper.x, goalkeeper.y, goalkeeper.width, goalkeeper.height);
    
    // Draw goalkeeper accent (gloves)
    ctx.fillStyle = goalkeeper.accent;
    // Left glove
    ctx.fillRect(goalkeeper.x - 5, goalkeeper.y + goalkeeper.height/3, 8, 15);
    // Right glove
    ctx.fillRect(goalkeeper.x + goalkeeper.width - 3, goalkeeper.y + goalkeeper.height/3, 8, 15);
    
    // Draw goalkeeper number
    ctx.fillStyle = "#000000";
    ctx.font = "bold 20px 'Press Start 2P',cursive";
    ctx.textAlign = "center";
    ctx.fillText(goalkeeper.number.toString(), goalkeeper.x + goalkeeper.width/2, goalkeeper.y + goalkeeper.height/2 + 7);
    
    // Draw diving trail effect
    if (goalkeeper.isDiving) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = "#ffff00";
        for(let i = 1; i <= 3; i++) {
            ctx.fillRect(
                goalkeeper.x - goalkeeper.diveDirection.x * i * 5,
                goalkeeper.y - goalkeeper.diveDirection.y * i * 5,
                goalkeeper.width,
                goalkeeper.height
            );
        }
        ctx.globalAlpha = 1.0;
    }
    
    // Draw goalkeeper aura (super keeper effect)
    if (goalkeeper.isDiving) {
        ctx.beginPath();
        ctx.arc(goalkeeper.x + goalkeeper.width/2, goalkeeper.y + goalkeeper.height/2, 50, 0, Math.PI * 2);
        ctx.strokeStyle = "#ffff00";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    ctx.restore();
}

function drawSlideTackles() {
    for(let i = 0; i < slideTackles.length; i++) {
        let tackle = slideTackles[i];
        ctx.save();
        ctx.globalAlpha = tackle.frames / SLIDE_TACKLE_DURATION;
        ctx.fillStyle = tackle.color || SLIDE_TACKLE_COLOR;
        ctx.beginPath();
        ctx.arc(tackle.x, tackle.y, tackle.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Classic green pitch with grass pattern
function drawPitch(){
    ctx.save();
    // Base green
    ctx.fillStyle = "#0a5c0a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grass pattern - subtle stripes
    ctx.fillStyle = "#0c6c0c";
    for(let i = 0; i < canvas.width; i += 40) {
        ctx.fillRect(i, 0, 20, canvas.height);
    }
    
    // White lines
    ctx.lineWidth=4;
    ctx.strokeStyle=PITCH_LINE;
    // Outer border
    ctx.strokeRect(10,10,canvas.width-20,canvas.height-20);
    // Halfway line
    ctx.beginPath();
    ctx.moveTo(canvas.width/2,10);
    ctx.lineTo(canvas.width/2,canvas.height-10);
    ctx.stroke();
    // Center circle
    ctx.beginPath();
    ctx.arc(canvas.width/2,canvas.height/2,78,0,2*Math.PI);
    ctx.stroke();
    // Center spot
    ctx.beginPath();
    ctx.arc(canvas.width/2,canvas.height/2,11,0,2*Math.PI);
    ctx.fillStyle="#ffffff";
    ctx.fill();

    // Penalty areas & goal boxes
    // Left
    ctx.strokeRect(10,canvas.height/2-115,68,230);
    ctx.strokeRect(10,canvas.height/2-70,38,140);
    // Right
    ctx.strokeRect(canvas.width-78,canvas.height/2-115,68,230);
    ctx.strokeRect(canvas.width-48,canvas.height/2-70,38,140);

    // Goals
    ctx.fillStyle=GOAL_COLOR;
    ctx.globalAlpha=0.3;
    ctx.fillRect(0,canvas.height/2-90,24,180);
    ctx.fillRect(canvas.width-24,canvas.height/2-90,24,180);
    ctx.globalAlpha=1.0;
    ctx.restore();
}

function drawBall(){
    ctx.save();
    ctx.shadowColor=BALL_COLOR;
    ctx.shadowBlur=10;
    ctx.fillStyle=ball.color;
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.radius,0,2*Math.PI);
    ctx.fill();
    ctx.closePath();
    ctx.lineWidth=2;
    ctx.strokeStyle = "#2fd771";
    ctx.stroke();
    ctx.restore();
}

// Utility: Rectangle-Circle collision
function rectCircleCollision(rect, circle){
    let testX=circle.x, testY=circle.y;
    if(circle.x<rect.x)testX=rect.x;
    else if(circle.x>rect.x+rect.width)testX=rect.x+rect.width;
    if(circle.y<rect.y)testY=rect.y;
    else if(circle.y>rect.y+rect.height)testY=rect.y+rect.height;
    let distX=circle.x-testX, distY=circle.y-testY;
    let dist=Math.sqrt(distX*distX+distY*distY);
    return dist<=circle.radius;
}

// Utility: Rectangle-Rectangle collision (for slide tackles)
function rectRectCollision(rect1, rect2){
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}
